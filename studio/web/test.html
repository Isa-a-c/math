<!doctype html>
<meta charset="utf-8">
<title>계산 검사</title>
<pre id="out"></pre>
<script src="math.js"></script>
<script>
'use strict';
/* 교재 값과 닫힌 해로 계산을 검사합니다. app.py --self-test가 이 페이지도 실행합니다. */
const results = { passed: true, checks: [] };
function near(actual, expected, tol, label) {
  const ok = Math.abs(actual - expected) <= tol;
  results.checks.push(`${ok ? 'ok' : 'FAIL'} ${label}: ${actual.toFixed(6)} / ${expected.toFixed(6)}`);
  if (!ok) results.passed = false;
}
function truth(ok, label) { results.checks.push(`${ok ? 'ok' : 'FAIL'} ${label}`); if (!ok) results.passed = false; }
const series = (expr, params, L, mode = 'full') => { const c = compile(expr), P = { ...params, L }; return buildSeries(x => c.fn(x, P), L, mode, 0); };

// 교재 11.1, 11.2, 11.4절
let m = series('k*sign(x)', { k: 1 }, PI);
near(m.b[1], 4 / PI, 1e-4, '11.1-1 b1'); near(m.b[3], 4 / (3 * PI), 1e-4, '11.1-1 b3'); near(m.b[2], 0, 1e-9, '11.1-1 b2');
truth(m.sym === 'odd' && m.jumps.length === 2, '11.1-1 기함수, 도약 2개');
near(partialSum(m, 99, 0), 0, 1e-9, '11.1-2 도약점의 합은 평균');
near(overshoot(m, m.jumps[0], 99), .0895, .002, 'Gibbs 초과량');
m = series('k*(step(x+1)-step(x-1))', { k: 1 }, 2);
near(m.a0, .5, 1e-5, '11.2-1 a0'); near(m.a[1], 2 / PI, 1e-4, '11.2-1 a1'); near(m.a[3], -2 / (3 * PI), 1e-4, '11.2-1 a3');
m = series('x>0 ? k*sin(x) : 0', { k: 1 }, PI);
near(m.a0, 1 / PI, 1e-5, '11.2-3 a0'); near(m.b[1], .5, 1e-5, '11.2-3 b1'); near(m.a[2], -2 / (3 * PI), 1e-5, '11.2-3 a2');
m = series('x+pi', {}, PI);
near(m.a0, PI, 1e-5, '11.2-5 a0'); near(m.b[1], 2, 1e-4, '11.2-5 b1'); near(m.b[2], -1, 1e-4, '11.2-5 b2');
for (const [N, E] of [[1, 8.1045], [2, 4.9629], [10, 1.1959], [20, .6129]]) near(squareError(m, N), E, 2e-3, `11.4-1 E*(${N})`);
m = series('x<L/2 ? 2*k*x/L : 2*k*(L-x)/L', { k: 1 }, PI, 'cosine');
near(m.a0, .5, 1e-5, '11.2-6 코사인 a0'); near(m.a[2], -16 / (4 * PI * PI), 1e-4, '11.2-6 a2'); truth(m.sym === 'even', '11.2-6 우함수 확장');
m = series('x<L/2 ? 2*k*x/L : 2*k*(L-x)/L', { k: 1 }, PI, 'sine');
near(m.b[1], 8 / (PI * PI), 1e-4, '11.2-6 사인 b1'); near(m.b[3], -8 / (9 * PI * PI), 1e-4, '11.2-6 b3'); truth(m.sym === 'odd', '11.2-6 기함수 확장');
truth(closedForm(4 / PI) === '4/π' && closedForm(-2 / (3 * PI)) === '−2/(3π)' && closedForm(.5) === '1/2' && closedForm(PI) === 'π', '닫힌 꼴 표기');

// 잘못된 입력
for (const bad of ['sin', '1/', 'x+#', '(x', 'a+b+c+d+f']) { let failed = false; try { compile(bad); } catch { failed = true; } truth(failed, `입력 오류 ${bad}`); }
for (const bad of ['1/x', 'log(x)']) { let failed = false; try { series(bad, {}, PI); } catch { failed = true; } truth(failed, `유계가 아닌 함수 ${bad}`); }
truth(Math.abs(compile('sin 2x').fn(PI / 4, {}) - 1) < 1e-12 && Math.abs(compile('sin x cos x').fn(PI / 4, {}) - .5) < 1e-12 && Math.abs(compile('2 sin x + 1').fn(PI / 2, {}) - 3) < 1e-12, '괄호 없는 함수 표기');
truth(compile('2x+3k').params[0] === 'k' && compile('2 sin(x)').fn(PI / 2, {}) === 2 && compile('-x^2').fn(3, {}) === -9, '수식 해석');

// 교재 12.3, 12.4, 12.6, 12.7절
const pde = (eq, bc, expr, params, opts, velExpr = '0') => { const c = compile(expr), v = compile(velExpr), L = opts.L ?? 1; return buildPde(eq, bc, x => c.fn(x, { ...params, L }), x => v.fn(x, { L }), { speed: 1, alpha: 1, tEnd: 1, ...opts, L }); };
const tri = x => { const s = ((x % 2) + 2) % 2; return s < 1 ? (s < .5 ? 2 * s : 2 - 2 * s) : -(s - 1 < .5 ? 2 * (s - 1) : 2 - 2 * (s - 1)); };
let w = pde('wave', 'fixed', 'x<L/2 ? 2*k*x/L : 2*k*(L-x)/L', { k: 1 }, { L: 1, N: 100 });
for (const [x, t] of [[.3, .2], [.5, .5], [.7, 1.3]]) near(w.u(x, t), .5 * (tri(x - t) + tri(x + t)), 5e-3, `12.3-1 u(${x},${t})와 식 (17)`);
truth(Math.abs(w.energy(0) - w.energy(1.37)) < 1e-9, '12.3 에너지 보존');
w = pde('wave', 'infinite', 'exp(-x^2)', {}, { X: 8, tEnd: 5 });
near(w.u(1, 2), .5 * (Math.exp(-1) + Math.exp(-9)), 1e-12, '12.4 D’Alembert 초기 속도 0');
w = pde('wave', 'infinite', '0', {}, { X: 8, tEnd: 5 }, 'exp(-x^2)');
near(w.u(0, 1), .5 * Math.sqrt(PI) * erf(1), 1e-3, '12.4 초기 속도 적분');
let h = pde('heat', 'fixed', 'U*sin(pi*x/L)', { U: 100 }, { L: 80, alpha: 1.158, N: 5 });
near(h.rate(1), .001785, 2e-6, '12.6-1 λ1²');
near(h.u(40, 388), 50, .1, '12.6-1 388초에 절반');
near(h.rate(3), .01607, 1e-5, '12.6-2 λ3²');
h = pde('heat', 'fixed', 'x<L/2 ? x : L-x', {}, { L: PI, alpha: 1, N: 60 });
near(h.coef[1], 4 / PI, 1e-4, '12.6-3 B1'); near(h.coef[3], -4 / (9 * PI), 1e-4, '12.6-3 B3');
h = pde('heat', 'insulated', 'x<L/2 ? x : L-x', {}, { L: PI, alpha: 1, N: 60 });
near(h.mean, PI / 4, 1e-5, '12.6-5 A0 = L/4'); near(h.coef[2], -8 / (4 * PI), 1e-3, '12.6-5 A2'); near(h.u(1, 40), PI / 4, 1e-5, '12.6-5 평균으로 수렴');
h = pde('heat', 'fixed', '0', {}, { L: 1, alpha: 1, N: 40, left: 20, right: 80 });
near(h.u(.25, 50), 35, 1e-6, '12.6 정상 상태 직선');
h = pde('heat', 'infinite', 'U*(step(x+1)-step(x-1))', { U: 100 }, { X: 3 });
for (const [x, t] of [[0, .125], [.5, 1], [2, 8]]) near(h.u(x, t), 50 * (erf((1 - x) / (2 * Math.sqrt(t))) + erf((1 + x) / (2 * Math.sqrt(t)))), .02, `12.7-1 u(${x},${t})`);
window.RESULTS = results;
document.getElementById('out').textContent = results.checks.join('\n');
</script>
