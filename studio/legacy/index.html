<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공업수학 강의 스튜디오</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="home">
  <header class="homehead">
    <h1>공업수학 강의 스튜디오</h1>
    <p>Kreyszig 『공업수학 10판 하』 11·12장. 다룰 개념을 고르면 설정과 강의 화면이 열립니다. <a href="one.html">← 한 곡선으로 돌아가기</a></p>
  </header>
  <div class="grid" id="homeGrid"></div>
</main>

<div id="stage" hidden>
  <header class="bar">
    <button type="button" class="btn" id="homeBtn">← 개념 선택</button>
    <strong id="conceptName"></strong><span class="sec" id="conceptSec"></span>
    <div class="chips presets" id="presets" aria-label="수업 구성"></div>
    <div class="row right">
      <button type="button" class="btn" id="saveCfg">구성 저장</button>
      <button type="button" class="btn" id="smaller" aria-label="글자 작게">가−</button>
      <button type="button" class="btn" id="bigger" aria-label="글자 크게">가+</button>
      <button type="button" class="btn" id="themeBtn">어둡게</button>
      <button type="button" class="btn" id="settingsBtn">설정 (S)</button>
      <button type="button" class="btn primary" id="presentBtn">발표 모드 (F)</button>
    </div>
  </header>
  <div class="work">
    <aside id="settings" aria-label="설정">
      <div id="settingsBody"></div>
      <p class="hint keys">F 발표 모드 · S 설정 · Space 재생 · ←→ 값 이동 · Esc 발표 끝내기</p>
    </aside>
    <main id="board">
      <div class="strip math" id="mathStrip"></div>
      <div id="panels" data-layout="one"></div>
      <div class="transport" id="transport"></div>
      <div class="readout" id="readout"></div>
      <div class="strip note" id="noteStrip"></div>
    </main>
  </div>
</div>
<script src="math.js"></script>
<script src="problems.js"></script>
<script src="plot.js"></script>
<script src="series.js"></script>
<script src="pde.js"></script>
<script src="app.js"></script>
</body>
</html>
