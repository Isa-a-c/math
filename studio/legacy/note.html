<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공업수학 문제 만들기</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="note">
<div id="noteApp">
  <header class="bar">
    <strong>Fourier 급수 문제 만들기</strong><span class="sec">11장</span>
    <div class="row right">
      <a class="btn" id="conceptDoc" href="concept_fourier.docx" download="Fourier 급수 개념 정리.docx">개념 설명 출력 (Word)</a>
      <button type="button" class="btn" id="smaller" aria-label="글자 작게">가−</button>
      <button type="button" class="btn" id="bigger" aria-label="글자 크게">가+</button>
      <button type="button" class="btn" id="themeBtn">어둡게</button>
      <a class="btn" href="topics.html">← 주제 목록</a>
      <button type="button" class="btn primary" id="presentBtn">발표 모드 (F)</button>
    </div>
  </header>
  <main id="makeView" class="split make">
    <section class="reading" aria-label="문제와 풀이">
      <div class="form">
        <div class="field"><label for="famSel">함수</label><select id="famSel"></select></div>
        <div class="field"><label for="kSel">k</label><select id="kSel"></select></div>
        <div class="field"><label for="lSel">L</label><select id="lSel"></select></div>
        <button type="button" class="btn" id="newNumbers">다른 값으로</button>
      </div>
      <h3>문제</h3>
      <p class="prob" id="exProblem"></p>
      <h3>풀이</h3>
      <div id="exSteps"></div>
      <div class="row stepBtns">
        <button type="button" class="btn primary" id="stepNext"></button>
        <button type="button" class="btn" id="stepAll">전부 보기</button>
        <button type="button" class="btn" id="stepHide">풀이 가리기</button>
      </div>
    </section>
    <section class="sidebar" aria-label="그래프와 문제지">
      <div class="panel figure small">
        <div class="cwrap"><canvas id="exGraph" role="img" aria-label="문제의 함수와 부분합 그래프"></canvas></div>
        <div class="field slider"><label for="exN">항의 개수 N</label><input id="exN" type="range" min="1" max="60" value="9"><output id="exNOut">9</output></div>
      </div>
      <div class="panel sheet">
        <header><h4>문제지</h4><span class="hint" id="sheetCount"></span></header>
        <div class="field"><label for="sheetTitle">제목</label><input id="sheetTitle" type="text" value="공업수학 연습문제"></div>
        <ol id="sheetList"></ol>
        <div class="row">
          <button type="button" class="btn primary" id="addSheet">이 문제 담기</button>
          <button type="button" class="btn" id="pdfQ">문제지 PDF</button>
          <button type="button" class="btn" id="pdfA">해설지 PDF</button>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="printArea"></div>
<script src="math.js"></script>
<script src="plot.js"></script>
<script src="series.js"></script>
<script src="derive.js"></script>
<script src="note.js"></script>
</body>
</html>
