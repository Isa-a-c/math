<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공업수학 강의 스튜디오 · 한 곡선</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="one">
<div id="oneStage">
  <header class="bar">
    <strong>한 곡선</strong>
    <div class="chips view" role="group" aria-label="보기">
      <button type="button" class="chip" data-show="drawn" aria-pressed="true">그린 곡선</button>
      <button type="button" class="chip" data-show="sum" aria-pressed="true">계수의 합</button>
      <button type="button" class="chip" data-show="wave" aria-pressed="true">현</button>
      <button type="button" class="chip" data-show="heat" aria-pressed="true">열</button>
    </div>
    <div class="field oneformula"><label for="formula"><i>f</i>(<i>x</i>) =</label><input id="formula" type="text" spellcheck="false" autocomplete="off" placeholder="수식도 됩니다. 예: sin(pi*x)+0.5*sin(3*pi*x)"></div>
    <span class="err" id="formulaErr" role="alert"></span>
    <div class="row right">
      <button type="button" class="btn" id="smaller" aria-label="글자 작게">가−</button>
      <button type="button" class="btn" id="bigger" aria-label="글자 크게">가+</button>
      <button type="button" class="btn" id="themeBtn">어둡게</button>
      <a class="btn" href="index.html">세부 화면</a>
      <button type="button" class="btn primary" id="presentBtn">발표 모드 (F)</button>
    </div>
  </header>
  <main id="board" data-right="2">
    <section class="panel" id="drawPanel"><header><h4>① 곡선을 그립니다</h4><div class="legend"><span><i style="background:var(--ink)"></i>그린 곡선</span><span><i style="background:var(--blue)"></i>계수의 합</span></div><button type="button" class="btn small" id="clear">지우기</button></header><div class="cwrap"><canvas id="cDraw" role="img" aria-label="곡선을 그리는 그래프"></canvas></div></section>
    <section class="panel" id="wavePanel"><header><h4>③ 현을 튕기면: 막대가 진동합니다</h4></header><div class="cwrap"><canvas id="cWave" role="img" aria-label="현의 진동과 시간에 따른 계수"></canvas></div></section>
    <section class="panel" id="barsPanel"><header><h4>② 계수 막대로 나뉩니다</h4><button type="button" class="btn small" id="undo" disabled>그린 곡선으로 되돌리기</button></header><div class="cwrap"><canvas id="cBars" role="img" aria-label="계수 막대. 끌면 크기가 바뀌고 누르면 꺼집니다."></canvas></div></section>
    <section class="panel" id="heatPanel"><header><h4>③ 열로 식히면: 막대가 줄어듭니다</h4></header><div class="cwrap"><canvas id="cHeat" role="img" aria-label="막대의 냉각과 시간에 따른 계수"></canvas></div></section>
  </main>
  <div class="transport">
    <button type="button" class="btn primary big" id="playBtn">▶ 튕기기</button>
    <label for="tSlider">시간</label><input id="tSlider" type="range" min="0" max="8" step="0.01" value="0"><output id="tOut">0</output>
    <label for="rate">속도</label><select id="rate"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    <label for="nSlider">항 N</label><input id="nSlider" class="short" type="range" min="1" max="60" value="24"><output id="nOut">24</output>
    <button type="button" class="btn" id="holdBtn" aria-pressed="false">소리 계속 듣기</button>
    <button type="button" class="btn" id="muteBtn" aria-pressed="false">소리 켜짐</button>
  </div>
  <div class="readout" id="readout"></div>
  <div class="question" id="question"></div>
</div>
<script src="math.js"></script>
<script src="plot.js"></script>
<script src="one.js"></script>
</body>
</html>
